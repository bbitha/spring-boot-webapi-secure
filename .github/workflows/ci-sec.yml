name: CI

on:
  push:
    branches: [ 'feature/**', 'bugfix/**', 'hotfix/**' ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read
  security-events: write
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-scans:
    name: Security scans (${{ github.event_name }})
    uses: ./.github/workflows/security-scans.yml
    with:
      # Dependency-Check es lento; en push a feature/** se omite por tiempo
      # y se deja para el PR y el nightly. En pull_request siempre corre.
      run_dependency_check: ${{ github.event_name == 'pull_request' }}
    secrets: inherit
