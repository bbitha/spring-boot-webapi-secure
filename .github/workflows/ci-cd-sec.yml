name: CI/CD

on:
  push:
    branches: [ main, develop ]

permissions:
  contents: read
  security-events: write
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

env:
  REGISTRY: ghcr.io

defaults:
  run:
    shell: bash

jobs:
  security-scans:
    name: Security scans (${{ github.event_name }})
    uses: ./.github/workflows/security-scans.yml
    with:
      run_dependency_check: true
    secrets: inherit

  docker-build-scan-push:
    name: Docker build, scan & publish
    needs: security-scans
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write
    env:
      TRIVY_IMAGE: aquasec/trivy:0.74.0
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v7

      - name: Definir nombre de imagen en minusculas
        run: echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Construir imagen (solo local, para escanear)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: scan-image:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Exportar imagen a tar (sin montar el socket de Docker)
        run: docker save "scan-image:${{ github.sha }}" -o "${{ runner.temp }}/image.tar"

      - name: Escanear paquetes del sistema operativo (ignorando sin fix)
        run: |
          docker run --rm -v "${{ runner.temp }}:/work" "$TRIVY_IMAGE" image \
            --input /work/image.tar \
            --pkg-types os \
            --ignore-unfixed \
            --exit-code 0 \
            --format json \
            --output /work/trivy-image-os.json

      - name: Escanear librerias de la aplicacion
        run: |
          docker run --rm -v "${{ runner.temp }}:/work" "$TRIVY_IMAGE" image \
            --input /work/image.tar \
            --pkg-types library \
            --exit-code 0 \
            --format json \
            --output /work/trivy-image-app.json

      - name: Generar SARIF de la imagen para Code scanning
        run: |
          docker run --rm -v "${{ runner.temp }}:/work" "$TRIVY_IMAGE" image \
            --input /work/image.tar \
            --exit-code 0 \
            --format sarif \
            --output /work/trivy-image.sarif

      - name: Subir SARIF de la imagen a Code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: ${{ runner.temp }}/trivy-image.sarif
          category: trivy-image

      - name: Publicar reportes de la imagen
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: report-image-trivy
          path: |
            ${{ runner.temp }}/trivy-image-os.json
            ${{ runner.temp }}/trivy-image-app.json
            ${{ runner.temp }}/trivy-image.sarif
          if-no-files-found: warn
          retention-days: 14

      # TODO (paso 5): hacer que este paso lea trivy-image-os.json y
      # trivy-image-app.json y bloquee por HIGH/CRITICAL (sin --ignore-unfixed
      # en las librerias de la app), igual que el Quality Gate de
      # security-scans.yml. Por ahora solo documenta la politica.

      - name: Iniciar sesion en GHCR
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extraer metadatos de la imagen
        if: github.ref == 'refs/heads/main'
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest

      - name: Publicar imagen en GHCR
        if: github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
