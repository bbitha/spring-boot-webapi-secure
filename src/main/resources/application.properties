spring.application.name=springboot-devsecops-lab

spring.datasource.url=jdbc:h2:mem:devsecopsdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=false

spring.sql.init.mode=always

# Solo se expone el endpoint de salud; el resto (env, beans, etc.) quedaba
# accesible sin autenticacion con exposure.include=* y show-values=always.
management.endpoints.web.exposure.include=health,info
server.error.include-message=never
server.error.include-stacktrace=never

# API key por variable de entorno; nunca un valor literal en el repositorio.
lab.external.api-key=${LAB_EXTERNAL_API_KEY:}

# Credenciales del usuario admin: solo como hash bcrypt via variable de
# entorno. Si ADMIN_PASSWORD_HASH falta o no es un hash bcrypt valido, no se
# registra ningun usuario admin (ver SecurityConfig) en vez de caer a una
# contrasena por defecto conocida.
app.security.admin-username=${ADMIN_USERNAME:admin}
app.security.admin-password-hash=${ADMIN_PASSWORD_HASH:}
