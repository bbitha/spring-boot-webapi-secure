# Perfil de pruebas (@ActiveProfiles("test")). No usar application.properties
# a secas en src/test/resources: ocultaria por completo la configuracion
# principal para TODAS las pruebas, incluso las que no piden este perfil.

# Base H2 propia para este perfil: si varios contextos de Spring (el de
# default y el de "test") cargaran schema.sql sobre el mismo nombre de base
# en memoria, el segundo falla con "tabla ya existe".
spring.datasource.url=jdbc:h2:mem:db-${random.uuid}

# Hash bcrypt de TestCredentials.ADMIN_PASSWORD ("Test-Admin-Pass-123!"),
# generado con BCryptPasswordEncoder. No es una credencial real.
app.security.admin-username=admin
app.security.admin-password-hash=$2a$10$UySHGRiVgn3WQfFHDa6ss.Xknremwk1i/0CvWqrOTJxk9qb2QHMUe
